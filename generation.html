<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IgniteInbox - Email Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div class="container">
        <div class="header">
            <h1>Email Studio</h1>
            <p class="tagline" id="studioSubheading">Generating emails for 3 prospects...</p>
        </div>

        <!-- Main Editor Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-header-title">
                    <div class="card-icon">✏️</div>
                    <div class="card-title">Compose & Edit</div>
                </div>
                <div id="email-navigation" class="email-counter">
                    <button class="nav-btn" id="prevBtn">‹</button>
                    <span id="counter">1 / 3</span>
                    <button class="nav-btn" id="nextBtn">›</button>
                </div>
            </div>

            <div class="recipient-info" id="recipientInfo">For: John Doe @ Acme Inc.</div>

            <!-- Subject Input -->
            <label for="emailSubject" class="form-label">Subject:</label>
            <input type="text" id="emailSubject" class="form-input" placeholder="Your email subject line...">

            <!-- Variable Toolbar -->
            <div class="variable-toolbar" style="margin-bottom: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <label class="form-label" style="margin-bottom: 0;">Insert:</label>
                <button class="btn-secondary btn-variable" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">[FirstName]</button>
                <button class="btn-secondary btn-variable" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">[LastName]</button>
                <button class="btn-secondary btn-variable" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">[Company]</button>
                <button class="btn-secondary btn-variable" style="padding: 0.2rem 0.6rem; font-size: 0.8rem;">[Role]</button>
            </div>

            <!-- Body Textarea -->
            <textarea id="emailBody" class="form-input" rows="12" placeholder="Your email body..."></textarea>

            <!-- Action Buttons -->
            <div class="action-buttons" style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                <button id="saveTemplateBtn" class="btn-secondary">Save as Template</button>
                <button id="sendEmailBtn" class="btn-primary" style="background: linear-gradient(135deg, #34a853, #4285f4);">Send Email</button>
            </div>
        </div>
    </div>

    <!-- Save Template Modal -->
    <div id="saveTemplateModal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2>Save Email Template</h2>
                <button id="modalCloseBtn" class="modal-close-btn">×</button>
            </div>
            <form id="saveTemplateForm">
                <label for="templateName" class="form-label">Template Name:</label>
                <input type="text" id="templateName" class="form-input" placeholder="e.g., Q4 Follow-up" required>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Template</button>
            </form>
        </div>
    </div>

    <!-- Firebase and Page-specific Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://cdn.jsdelivr.net/npm/@google/generative-ai@0.1.0/dist/index.mjs";
        import { firebaseConfig } from './firebase-config.js';

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = null;
        let genAI = null;

        // --- App State ---
        let generatedEmails = [];
        let currentEmailIndex = 0;

        // --- DOM Elements ---
        const subheading = document.getElementById('studioSubheading');
        const recipientInfo = document.getElementById('recipientInfo');
        const emailSubject = document.getElementById('emailSubject');
        const emailBody = document.getElementById('emailBody');
        const counterDisplay = document.getElementById('counter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const saveTemplateBtn = document.getElementById('saveTemplateBtn');
        const saveTemplateModal = document.getElementById('saveTemplateModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const saveTemplateForm = document.getElementById('saveTemplateForm');
        const templateNameInput = document.getElementById('templateName');
        const variableButtons = document.querySelectorAll('.btn-variable');

        // --- Main Functions ---

        async function initializeAI() {
            try {
                const API_KEY = 'AIzaSyAMIen9b701UekKNPVEuICV42kFZmhoUs4';
                genAI = new GoogleGenerativeAI(API_KEY);
            } catch (error) {
                console.error('Failed to initialize AI:', error);
                subheading.textContent = "Error: Could not initialize AI service.";
            }
        }

        async function generateSingleEmail(task, prospect) {
            const prompt = `
            Write a personalized cold outreach email in ${task.language}.
            SENDER: ${task.senderInfo.firstName} ${task.senderInfo.lastName}, ${task.senderInfo.role} at ${task.senderInfo.company}. Background: ${task.senderInfo.bio}.
            PROSPECT: ${prospect.FirstName} ${prospect.LastName}, ${prospect.Role} at ${prospect.Company}.
            GOAL: ${task.purpose}.
            REQUIREMENTS:
            1. Personalize using both sender and prospect info.
            2. Be concise (150-200 words).
            3. Sound professional but conversational.
            4. Create a compelling subject line in ${task.language}.
            5. Do NOT include a closing or signature (e.g., "Best regards,").
            OUTPUT FORMAT (Strict):
            Subject: [Your subject line in ${task.language}]

            [Email body in ${task.language}]
            `;
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
            const result = await model.generateContent(prompt);
            return result.response.text();
        }

        function updateEditorDisplay() {
            if (generatedEmails.length === 0) return;

            const currentEmail = generatedEmails[currentEmailIndex];
            recipientInfo.textContent = `For: ${currentEmail.prospect.FirstName} ${currentEmail.prospect.LastName} @ ${currentEmail.prospect.Company}`;
            emailSubject.value = currentEmail.subject;
            emailBody.value = currentEmail.body;
            counterDisplay.textContent = `${currentEmailIndex + 1} / ${generatedEmails.length}`;

            prevBtn.disabled = currentEmailIndex === 0;
            nextBtn.disabled = currentEmailIndex === generatedEmails.length - 1;
        }

        async function loadGenerationData() {
            const taskDataString = localStorage.getItem('igniteinbox_generation_task');
            if (!taskDataString) {
                subheading.textContent = "No generation task found. Please start from the main page.";
                return;
            }

            const taskData = JSON.parse(taskDataString);
            subheading.textContent = `Generating 0/${taskData.prospects.length} emails...`;

            for (let i = 0; i < taskData.prospects.length; i++) {
                const prospect = taskData.prospects[i];
                try {
                    const emailContent = await generateSingleEmail(taskData, prospect);
                    const subjectMatch = emailContent.match(/Subject:\s*(.+)/i);
                    const subject = subjectMatch ? subjectMatch[1].trim() : `A message for ${prospect.Company}`;
                    const body = emailContent.replace(/Subject:\s*.+\n*/i, '').trim();
                    generatedEmails.push({ prospect, subject, body });
                } catch (error) {
                    console.error(`Failed to generate email for ${prospect.FirstName}:`, error);
                    generatedEmails.push({ prospect, subject: "Generation Failed", body: `Could not generate email for this prospect. Error: ${error.message}` });
                }
                subheading.textContent = `Generating ${i + 1}/${taskData.prospects.length} emails...`;
            }

            subheading.textContent = `Generation complete! Review and edit your emails below.`;
            localStorage.removeItem('igniteinbox_generation_task');
            updateEditorDisplay();
        }

        // --- Event Listeners ---
        prevBtn.addEventListener('click', () => {
            if (currentEmailIndex > 0) {
                currentEmailIndex--;
                updateEditorDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentEmailIndex < generatedEmails.length - 1) {
                currentEmailIndex++;
                updateEditorDisplay();
            }
        });

        variableButtons.forEach(button => {
            button.addEventListener('click', () => {
                const variable = button.textContent;
                const start = emailBody.selectionStart;
                const end = emailBody.selectionEnd;
                const text = emailBody.value;
                emailBody.value = text.substring(0, start) + variable + text.substring(end);
                emailBody.focus();
                emailBody.selectionEnd = start + variable.length;
            });
        });

        saveTemplateBtn.addEventListener('click', () => {
            if (!emailSubject.value.trim() || !emailBody.value.trim()) {
                alert('Please provide a subject and body before saving a template.');
                return;
            }
            saveTemplateModal.classList.remove('hidden');
        });

        modalCloseBtn.addEventListener('click', () => saveTemplateModal.classList.add('hidden'));

        saveTemplateForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert('You must be logged in.');
            const templateName = templateNameInput.value.trim();
            if (!templateName) return alert('Please provide a name for your template.');

            const templateData = { name: templateName, subject: emailSubject.value, body: emailBody.value, createdAt: serverTimestamp() };
            try {
                await addDoc(collection(db, "users", currentUser.uid, "templates"), templateData);
                alert(`Template "${templateName}" saved!`);
                saveTemplateModal.classList.add('hidden');
                saveTemplateForm.reset();
            } catch (error) {
                console.error("Error saving template:", error);
                alert('Could not save template.');
            }
        });

        // --- Page Initialization ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await initializeAI();
                await loadGenerationData();
            } else {
                window.location.replace('/loginsignupsys.html');
            }
        });
    </script>
</body>
</html>
